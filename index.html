<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hanh-trinh-tinh-yeu/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Kỷ niệm 1 tháng yêu nhau - Hành Trình Tình Yêu">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hành Trình Tình Yêu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Hành Trình Tình Yêu 💕</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!-- Background music -->
  <audio id="bgMusic" loop preload="auto">
    <source src="assets/assets/audio/background_music.mp3" type="audio/mpeg">
  </audio>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Phát nhạc khi user click bất cứ đâu (bypass browser autoplay policy)
    var musicPlayed = false;
    function playMusic() {
      if (musicPlayed) return;
      var audio = document.getElementById('bgMusic');
      audio.volume = 0.5;
      audio.play().then(function () {
        musicPlayed = true;
        console.log('[Music] Playing!');
      }).catch(function (e) {
        console.log('[Music] Error:', e);
      });
    }
    // Lắng nghe click/tap trên toàn trang
    document.addEventListener('click', playMusic, true);
    document.addEventListener('touchstart', playMusic, true);
    document.addEventListener('keydown', playMusic, true);
  </script>
</body>

</html>
